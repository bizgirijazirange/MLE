# ===========================================================================
# CI Pipeline — MLE Supply Chain Pipeline
# ===========================================================================
# GitHub Actions workflow that runs code-quality checks on every PR and push.
#
# Checks performed:
#   1. Pylint  — style + error + code smell checks (pylint)
#   2. Mypy    — static type checking
#   3. Pytest  — unit & integration tests
#
# Triggers:
#   - Pull request to main
#   - Push to main
#   - Push to any feature branch (prefixed with feat/, fix/, chore/, etc.)
#   - Manual (workflow_dispatch)
#
# The workflow does NOT deploy anything — that is handled by cd.yaml.
# All checks must pass before a PR can be merged to main.
# ===========================================================================

name: CI — MLE Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout repository ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Set up Python ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # --- Install dependencies (linting, typing, testing + project deps) ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint mypy pytest pytest-cov
          pip install -r requirements.txt

      # --- Pylint: lint + style + code smell check ---
      - name: Pylint check
        run: pylint src/ --rcfile=.pylintrc --fail-under=8.0

      # --- Mypy: static type checking ---
      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports

      # --- Pytest: unit & integration tests with coverage ---
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing