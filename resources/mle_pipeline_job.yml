# ===========================================================================
# MLE Pipeline Job Resource
# ===========================================================================
# Extracted from databricks.yaml into resources/ for DAB bundle modularity.
# DAB automatically includes all *.yml files in the resources/ directory.
# ===========================================================================

resources:
  jobs:
    MLE_pipeline:
      name: MLE_pipeline_new
      tasks:
        - task_key: entry_point
          spark_python_task:
            python_file: /Workspace/Users/girija.zirange@bizmetric.com/MLE/src/main.py
          environment_key: entry_point_environment
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: entry_point_environment
          spec:
            dependencies:
              - databricks
              - databricks-feature-engineering
              - scikit-learn
              - xgboost
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED