# ===========================================================================
# Databricks Asset Bundle — MLE Supply Chain Pipeline
# ===========================================================================
# Deploys the pipeline as a Databricks Job (spark_python_task) that runs
# main.py with a --config-file parameter.
#
# Usage:
#   databricks bundle validate --target dev
#   databricks bundle deploy  --target dev
#   databricks bundle run     mle_pipeline_job --target dev
#
# CI/CD: .github/workflows/cd.yaml runs these commands on push to main.
#
# Libraries (explicitly listed for reproducibility):
#   - databricks-feature-engineering: NOT pre-installed on Databricks Runtime.
#   - scikit-learn: pre-installed, but listed for explicit dependency tracking.
#   - pyspark, mlflow, pandas, numpy, pyyaml, matplotlib, databricks-sdk:
#     pre-installed (see requirements.txt for the full list).
# ===========================================================================

bundle:
  name: mle-pipeline

variables:
  config_file:
    description: "Path to the environment config YAML file"

resources:
  jobs:
    MLE_pipeline:
      name: MLE_pipeline
      tasks:
        - task_key: entry_point
          spark_python_task:
            python_file: /Workspace/Users/girija.zirange@bizmetric.com/MLE/src/main.py
          environment_key: entry_point_environment
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: entry_point_environment
          spec:
            dependencies:
              - databricks
              - databricks-feature-engineering
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED


targets:
  dev:
    mode: development
    variables:
      config_file: /Workspace/Users/girija.zirange@bizmetric.com/MLE/config/dev.yaml

  prod:
    mode: production
    variables:
      config_file: /Workspace/Users/girija.zirange@bizmetric.com/MLE/config/prod.yaml
